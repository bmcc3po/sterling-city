<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#05060d" />
    <title>STERLING CITY</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23050a14'/%3E%3Cpath d='M8 40 L32 16 L56 40 L48 40 L48 52 L16 52 L16 40Z' fill='%23ffc44d'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <canvas id="gl"></canvas>
    <div id="hud">
      <div class="hud-top">
        <div class="hud-left">
          <div class="radar-wrap">
            <canvas id="minimap" width="220" height="220"></canvas>
            <div class="radar-label">N</div>
          </div>
          <div id="cash">$0</div>
        </div>
        <div class="hud-center">
          <div id="radio">FLASH FM · Night Circuit</div>
          <div id="objective">DRIVE TO THE GOLD BLIP — COURIER DROP</div>
        </div>
        <div class="hud-right">
          <div id="wanted" aria-label="wanted stars"><span>☆</span><span>☆</span><span>☆</span><span>☆</span><span>☆</span></div>
          <div id="speed"><b>0</b><small>MPH</small></div>
          <button id="theme" type="button" title="Toggle lights">NIGHT</button>
        </div>
      </div>

      <div id="title-card">
        <p class="city-tag">KID-SAFE OPEN CITY</p>
        <h1>STERLING CITY</h1>
        <p class="tagline">YOUR RIDE. YOUR MISSIONS. MATH IS THE HEIST.</p>
      </div>

      <div id="toast"></div>

      <div id="joystick" class="stick">
        <div class="stick-base"><div class="stick-knob"></div></div>
      </div>
      <div id="pedals">
        <button id="brake" type="button">BRAKE</button>
        <button id="gas" type="button">GAS</button>
      </div>
      <button id="interact" type="button" hidden>START MISSION</button>

      <div id="math-gate" hidden>
        <div class="gate-shell">
          <div class="gate-kicker" id="gate-kicker">COURIER LOCK</div>
          <h2 id="gate-title">Exact change</h2>
          <p id="gate-prompt"></p>
          <div id="place-houses" hidden></div>
          <div id="fall-lanes" hidden></div>
          <div id="answers"></div>
        </div>
      </div>

      <div id="coach" hidden>
        <div class="coach-flash">
          <div class="siren-bar"></div>
          <p class="coach-kicker">COACH CALLED TIMEOUT</p>
          <h2 id="coach-title">Hold up.</h2>
          <p id="coach-body"></p>
        </div>
      </div>

      <div id="boss" hidden>
        <div class="boss-hud">
          <div class="boss-top">
            <span>VAULT BONUS</span>
            <b id="boss-time">20.0</b>
          </div>
          <p id="boss-prompt"></p>
          <div id="boss-answers"></div>
          <div id="boss-cash">$0</div>
        </div>
      </div>
    </div>
    <div id="boot">
      <div class="boot-mark">SC</div>
      <p>LOADING THE GRID</p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
